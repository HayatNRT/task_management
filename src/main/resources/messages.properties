#  Success
response.SUCCESS=S200|Request completed successfully.
response.RESOURCE_CREATED=S201|The resource has been created successfully.

#  Validation Errors (V4xxx)
response.VALIDATION_MISSING_FIELDS=V4001|Required fields are missing. Please provide all necessary details.
response.VALIDATION_INVALID_FORMAT=V4002|The provided data format is incorrect. Please check and try again.
response.VALIDATION_DATA_TOO_LARGE=V4003|The input data exceeds the allowed limit. Reduce size and retry.
response.VALIDATION_DUPLICATE=V4004|A similar record already exists. Please use unique values.
response.VALIDATION_INVALID_EMAIL=V4005|The email format is invalid.
response.VALIDATION_UNSUPPORTED_MEDIA=V4006|The media type is not supported for this request.

# Authentication & Authorization Errors (A4xxx)
response.AUTH_UNAUTHORIZED=A4011|Access denied. Invalid username or password.
response.AUTH_TOKEN_EXPIRED=A4012|Your session has expired. Please log in again.
response.AUTH_TOKEN_INVALID=A4013|Authentication failed due to an invalid token.
response.AUTH_ACCESS_DENIED=A4014|You do not have permission to perform this action.
response.AUTH_ACCOUNT_DISABLED=A4015|Your account has been disabled. Please contact support.
response.AUTH_TOO_MANY_REQUESTS=A4291|Too many requests. Please try again later.

#  Client Errors (C4xxx)
response.CLIENT_RESOURCE_NOT_FOUND=C4041|The requested resource could not be found.
response.CLIENT_ENDPOINT_NOT_FOUND=C4042|The requested API endpoint does not exist.
response.CLIENT_OPERATION_NOT_ALLOWED=C4051|The requested operation is not allowed for this resource.

#  Server Errors (S5xxx)
response.SERVER_ERROR=E5001|An unexpected server error occurred. Please try again later.
response.SERVER_DATABASE_ERROR=E5002|Database connection failed. Please contact support.
response.SERVER_UNAVAILABLE=E5031|Service is temporarily unavailable. Please try again later.
response.SERVER_TIMEOUT=E5041|The request timed out. Please try again later.
response.SERVER_FILE_STORAGE_FAILED=E5003|Failed to store the file. Please try again later.

#  Business Logic
response.BUSINESS_RESOURCE_LOCKED=B4031|This resource is currently locked and cannot be modified.
response.BUSINESS_CONFLICT=B4091|A business conflict occurred. Please check your request.

# Fallback / Unknown
response.UNKNOWN=E5000|An unknown error occurred. Please contact support.
