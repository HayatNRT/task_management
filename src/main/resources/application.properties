spring.application.name=task_management

server.port=8087

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


#application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970


spring.datasource.url=jdbc:postgresql://localhost:5432/nrt_tms
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP stability tuning
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=150000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-timeout=30000

# Ensures stale connections are validated
